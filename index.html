<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tidara Tide Map</title>
<meta name="description" content="Tidara: interactive tide predictions for 303 Indonesian tide gauge stations.">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<script src="assets/prefs.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Sea chart in two lights: day (pale sea, warm paper land) and night (deep navy). Full-bleed map, floating glass
     controls, a right drawer (bottom sheet on phones) for the selected station, a timeline along the bottom edge. */
  --sea: #dfeaf1; --land: #fbf8f1; --coast: #93a9b6; --border: rgba(150,120,80,.6); --grid: rgba(60,90,110,.10);
  --glass: rgba(255,255,255,0.9); --ink: #13212b; --muted: #556b78; --line: rgba(60,90,110,0.18);
  --accent: #0b8c83; --accent-ink: #ffffff; --soft: rgba(11,140,131,.12); --field: rgba(255,255,255,.8);
  --label-bg: rgba(255,255,255,.86); --label-ink: #13212b; --mark-edge: rgba(255,255,255,.95); --hw: #1f6fd1; --lw: #c0621d;
  --menu: #ffffff; --shadow: 0 8px 26px rgba(30,60,80,.16);
  --font: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
:root[data-theme="dark"] {
  --sea: #071520; --land: #142430; --coast: #35525f; --border: rgba(160,140,110,.55); --grid: rgba(142,165,178,.08);
  --glass: rgba(10,24,34,0.86); --ink: #e6f0f4; --muted: #8ea5b2; --line: rgba(142,165,178,0.22);
  --accent: #45d0c3; --accent-ink: #062026; --soft: rgba(69,208,195,.15); --field: rgba(0,0,0,.25);
  --label-bg: rgba(7,21,32,.74); --label-ink: #e6f0f4; --mark-edge: rgba(7,21,32,.85); --hw: #7cc4ff; --lw: #f6a96b;
  --menu: #0d1d28; --shadow: 0 8px 30px rgba(0,0,0,.35);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; overflow: hidden; background: var(--sea); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
select option { background: var(--menu); color: var(--ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
#map { position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
#map.drag { cursor: grabbing; }
.glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }

.top { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; gap: 10px; align-items: flex-start; pointer-events: none; z-index: 5; }
.top > * { pointer-events: auto; }
.brand { display: flex; align-items: center; gap: 9px; padding: 7px 12px 7px 8px; text-decoration: none; color: var(--ink); }
.brand img { width: 30px; height: 30px; }
.brand b { font-size: 19px; letter-spacing: .02em; font-weight: 700; }
.brand small { display: block; font-size: 10.5px; color: var(--muted); margin-top: -3px; letter-spacing: .02em; }
.search { position: relative; width: min(320px, 100%); }
.search input { width: 100%; padding: 11px 12px 11px 36px; border-radius: 12px; border: 1px solid var(--line); background: var(--glass); backdrop-filter: blur(10px); box-shadow: var(--shadow); }
.search svg { position: absolute; left: 12px; top: 13px; opacity: .7; z-index: 1; pointer-events: none; }
.results { position: absolute; top: 46px; left: 0; right: 0; max-height: 50vh; overflow: auto; padding: 4px; display: none; }
.results.show { display: block; }
.results button { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 8px; }
.results button:hover, .results button.on { background: var(--soft); }
.results small { color: var(--muted); white-space: nowrap; }
.spacer { flex: 1; }
.nav { display: flex; gap: 2px; padding: 4px; align-items: center; }
.nav a, .nav button { color: var(--ink); text-decoration: none; padding: 7px 11px; border-radius: 8px; font-weight: 500; font-size: 13px; border: 0; background: none; }
.nav a:hover, .nav button:hover { background: var(--soft); }
.nav .js-lang { font-weight: 700; letter-spacing: .04em; min-width: 38px; }
.nav .js-theme { display: grid; place-items: center; padding: 7px 9px; }

.layers { position: fixed; right: 12px; top: calc(70px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 2px; padding: 5px; z-index: 4; transition: right .25s ease; }
.layers button { display: flex; align-items: center; gap: 9px; border: 0; background: none; padding: 8px 12px 8px 9px; border-radius: 8px; font-size: 13px; text-align: left; color: var(--muted); }
.layers button.on { color: var(--ink); background: var(--soft); }
.layers button i { width: 12px; height: 12px; border-radius: 50%; flex: none; }
.layers .sep { height: 1px; background: var(--line); margin: 4px 6px; }
.layers label { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
.zoom { position: fixed; right: 12px; display: flex; flex-direction: column; z-index: 4; overflow: hidden; transition: right .25s ease; }
.zoom button { width: 38px; height: 36px; border: 0; background: none; font-size: 18px; }
.zoom button + button { border-top: 1px solid var(--line); }
body.p-open .layers, body.p-open .zoom { right: 464px; }

.legend { position: fixed; left: 12px; bottom: calc(86px + env(safe-area-inset-bottom)); padding: 8px 10px; z-index: 4; font-size: 11px; min-width: 210px; }
.legend .ramp { height: 8px; border-radius: 4px; margin: 6px 0 3px; }
.legend .ends { display: flex; justify-content: space-between; color: var(--muted); gap: 8px; }
.legend .cats { display: grid; gap: 4px; margin-top: 6px; }
.legend .cats span { display: flex; align-items: center; gap: 7px; }
.legend .cats i { width: 10px; height: 10px; border-radius: 50%; }
.timeline { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: flex; align-items: center; gap: 12px; padding: 9px 12px; z-index: 4; }
.play { width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.tl-time { min-width: 168px; line-height: 1.2; }
.tl-time b { display: block; font-size: 15px; }
.tl-time span { color: var(--muted); font-size: 12px; }
.track { position: relative; flex: 1; height: 38px; touch-action: none; cursor: pointer; }
.track canvas { width: 100%; height: 100%; display: block; }
.tl-tz { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 6px; font-size: 12px; max-width: 190px; }
.now-btn { border: 1px solid var(--line); background: transparent; border-radius: 8px; padding: 6px 10px; font-size: 12px; }
.attrib { position: fixed; right: 14px; bottom: calc(70px + env(safe-area-inset-bottom)); font-size: 10.5px; color: var(--muted); z-index: 3; text-align: right; pointer-events: none; }
.tip { position: fixed; pointer-events: none; padding: 7px 10px; font-size: 12px; z-index: 6; display: none; white-space: nowrap; }
.tip b { display: block; font-size: 13px; }

.panel { position: fixed; top: calc(68px + env(safe-area-inset-top)); right: 12px; bottom: calc(76px + env(safe-area-inset-bottom)); width: 440px; z-index: 7; display: flex; flex-direction: column; transform: translateX(calc(100% + 24px)); transition: transform .25s ease; }
.panel.open { transform: none; }
.panel .grip { display: none; }
.p-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.p-head h2 { margin: 0; font-size: 19px; line-height: 1.2; text-wrap: balance; }
.p-head .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { font-size: 11.5px; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.chip.g-A { color: #1a8a4d; border-color: rgba(26,138,77,.4); } .chip.g-B { color: #a07400; border-color: rgba(160,116,0,.4); } .chip.g-C { color: #c0392b; border-color: rgba(192,57,43,.4); }
:root[data-theme="dark"] .chip.g-A { color: #7ee2a8; } :root[data-theme="dark"] .chip.g-B { color: #f2cf6b; } :root[data-theme="dark"] .chip.g-C { color: #ff8f8f; }
.x { margin-left: auto; border: 0; background: var(--soft); width: 32px; height: 32px; border-radius: 8px; flex: none; font-size: 16px; }
.p-body { overflow: auto; padding: 12px 16px 18px; display: grid; gap: 14px; overscroll-behavior: contain; }
.card { border: 1px solid var(--line); border-radius: 10px; padding: 12px; background: color-mix(in srgb, var(--glass) 60%, transparent); }
.card h3 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.nowrow { display: grid; grid-template-columns: 1.1fr 1fr 1fr; gap: 10px; }
.big { font-size: 26px; font-weight: 700; line-height: 1.1; }
.lbl { font-size: 11.5px; color: var(--muted); }
.trend { font-size: 12px; color: var(--accent); }
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
.form label { display: grid; gap: 3px; font-size: 11.5px; color: var(--muted); }
.form input, .form select { width: 100%; padding: 7px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); }
.len { display: grid; grid-template-columns: 1fr 1.2fr; gap: 6px; }
.run { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; }
.btn { border: 0; border-radius: 9px; padding: 9px 14px; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn:disabled { opacity: .5; cursor: default; }
.hint { font-size: 11.5px; color: var(--muted); }
.prog { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: none; margin-top: 8px; }
.prog i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
.chart { position: relative; height: 230px; margin-top: 10px; touch-action: none; }
.chart canvas { width: 100%; height: 100%; display: block; }
.chart .cross { position: absolute; top: 4px; right: 6px; font-size: 11.5px; color: var(--muted); text-align: right; pointer-events: none; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.stats div { font-size: 11.5px; color: var(--muted); }
.stats b { display: block; font-size: 14px; color: var(--ink); }
.tabs { display: flex; gap: 4px; margin: 12px 0 8px; }
.tabs button { border: 1px solid var(--line); background: none; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; color: var(--muted); }
.tabs button.on { color: var(--ink); background: var(--soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
td.r, th.r { text-align: right; }
.hw { color: var(--hw); } .lw { color: var(--lw); }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); }
.pager button { border: 1px solid var(--line); background: none; border-radius: 7px; padding: 4px 10px; }
.exports { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12.5px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.foot { font-size: 11px; color: var(--muted); text-align: center; padding-top: 4px; }
.toast { position: fixed; left: 50%; top: calc(70px + env(safe-area-inset-top)); transform: translateX(-50%); padding: 9px 14px; z-index: 9; display: none; font-size: 13px; max-width: calc(100% - 24px); }

@media (max-width: 760px) {
  .brand small, .nav a.hide-m { display: none; }
  .top { flex-wrap: wrap; }
  .search { order: 3; width: 100%; }
  body.p-open .layers { right: 12px; }
  .layers { top: auto; bottom: calc(150px + env(safe-area-inset-bottom)); }
  .layers button span, .layers label span { display: none; }
  .layers button { padding: 9px; } .layers label { padding: 6px 9px; }
  .zoom { display: none; }
  .legend { bottom: calc(80px + env(safe-area-inset-bottom)); min-width: 0; max-width: 62vw; }
  .timeline { gap: 8px; padding: 7px 9px; }
  .tl-time { min-width: 100px; } .tl-time b { font-size: 13px; }
  .tl-tz, .now-btn { display: none; }
  .attrib { display: none; }
  .panel { left: 0; right: 0; width: auto; top: auto; bottom: 0; height: 72%; border-radius: 16px 16px 0 0; transform: translateY(105%); }
  .panel .grip { display: block; width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
  .big { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { .panel, .layers, .zoom { transition: none; } }
</style>
</head>
<body>
<canvas id="map" aria-label="Map of Indonesian tide stations"></canvas>

<div class="top">
  <a class="brand glass" href="index.html" title="Tidara">
    <img src="assets/logo.svg" alt="">
    <div><b>tidara</b><small data-i18n="tagline"></small></div>
  </a>
  <div class="search">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" autocomplete="off">
    <div class="results glass" id="results"></div>
  </div>
  <div class="spacer"></div>
  <nav class="nav glass">
    <a href="guide.html" data-i18n="guide"></a>
    <a href="science.html" class="hide-m" data-i18n="science"></a>
    <button class="js-lang" type="button">ID</button>
    <button class="js-theme" type="button"></button>
  </nav>
</div>

<div class="layers glass" id="layers" role="radiogroup"></div>
<div class="zoom glass" id="zoomctl"><button id="zin">+</button><button id="zout">−</button></div>
<div class="legend glass" id="legend"></div>
<div class="attrib" data-i18n="attrib"></div>

<div class="timeline glass">
  <button class="play" id="play"><svg id="playicon" width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg></button>
  <div class="tl-time num"><b id="tlTime">—</b><span id="tlDate">—</span></div>
  <div class="track" id="track"><canvas id="trackc"></canvas></div>
  <button class="now-btn" id="nowbtn" data-i18n="now"></button>
  <select class="tl-tz" id="tz"></select>
</div>

<div class="tip glass" id="tip"></div>
<div class="toast glass" id="toast" role="status"></div>

<aside class="panel glass" id="panel">
  <div class="grip"></div>
  <div class="p-head">
    <div style="min-width:0">
      <h2 id="pName"></h2>
      <div class="sub" id="pSub"></div>
      <div class="chips" id="pChips"></div>
    </div>
    <button class="x" id="pClose">✕</button>
  </div>
  <div class="p-body" id="pBody">
    <section class="card">
      <h3 data-i18n="atTime"></h3>
      <div class="nowrow">
        <div><div class="lbl" data-i18n="waterLevel"></div><div class="big num" id="nowH">—</div><div class="trend" id="nowTrend"></div></div>
        <div><div class="lbl" data-i18n="nextHW"></div><div class="num" id="nextHW">—</div></div>
        <div><div class="lbl" data-i18n="nextLW"></div><div class="num" id="nextLW">—</div></div>
      </div>
    </section>

    <section class="card">
      <h3 data-i18n="prediction"></h3>
      <form class="form" id="pf">
        <label for="fStart"><span data-i18n="start"></span><input type="datetime-local" id="fStart" step="60"></label>
        <label for="fLen"><span data-i18n="length"></span>
          <span class="len"><input type="number" id="fLen" min="1" step="1" value="3"><select id="fUnit"><option value="h"></option><option value="d" selected></option><option value="m"></option><option value="y"></option></select></span>
        </label>
        <label for="fStep"><span data-i18n="interval"></span><select id="fStep"><option value="1"></option><option value="5"></option><option value="10" selected></option><option value="15"></option><option value="30"></option><option value="60"></option></select></label>
        <label for="fTz"><span data-i18n="timeZone"></span><select id="fTz"></select></label>
        <label for="fDatum" style="grid-column:1/-1"><span data-i18n="heights"></span><select id="fDatum"><option value="LAT"></option><option value="MSL"></option><option value="HAT"></option></select></label>
        <div class="run"><button class="btn" id="fRun" type="submit" data-i18n="predict"></button><span class="hint" id="fHint"></span></div>
      </form>
      <div class="prog" id="prog"><i></i></div>
      <div id="out" hidden>
        <div class="stats num" id="stats"></div>
        <div class="chart" id="chartbox"><canvas id="chart"></canvas><div class="cross num" id="cross"></div></div>
        <div class="hint" data-i18n="chartHint"></div>
        <div class="tabs" role="tablist"><button class="on" data-tab="ext" role="tab" data-i18n="tabExt"></button><button data-tab="ser" role="tab" data-i18n="tabSer"></button></div>
        <div id="tbl"></div>
        <div class="pager" id="pager"></div>
        <div class="exports">
          <button class="btn ghost" id="dlExt" type="button" data-i18n="dlExt"></button>
          <button class="btn ghost" id="dlSer" type="button" data-i18n="dlSer"></button>
          <button class="btn ghost" id="cpExt" type="button" data-i18n="cpExt"></button>
        </div>
      </div>
    </section>

    <section class="card"><h3 data-i18n="station"></h3><dl class="kv" id="pInfo"></dl></section>
    <section class="card"><h3 data-i18n="levels"></h3><table id="pDatums"></table></section>
    <section class="card">
      <h3 data-i18n="constants"></h3>
      <table id="pConst"></table>
      <div class="exports"><button class="btn ghost" id="moreConst" type="button"></button></div>
    </section>
    <div class="foot" data-i18n="foot"></div>
  </div>
</aside>

<script src="assets/tidara-data.js"></script>
<script src="assets/basemap.js"></script>
<script src="assets/tide-engine.js"></script>
<script>
"use strict";
const DB = window.TIDARA_DB, E = window.TidaraEngine, PR = window.TidaraPrefs;
const ST = DB.stations, NODATA = DB.nodata.filter((s) => s.lat != null);
const byCode = Object.fromEntries(ST.map((s) => [s.code, s]));
const $ = (id) => document.getElementById(id);
const HOUR = 3600000, DAY = 86400000, dpr = () => Math.min(window.devicePixelRatio || 1, 2);

/* ---------- language ---------- */
const I18N = {
  en: {
    tagline: "Tides of the Nusantara seas", guide: "User guide", science: "Science", search: "Search 303 stations…", noMatch: "No station matches “{q}”.",

    lyr_level: "Water level", lyr_range: "Tidal range", lyr_type: "Tide type", lyr_grade: "Data quality", noData: "Stations without data", layerGroup: "Map layer",

    legRange: "Tidal range (HAT − LAT)", legType: "Tide type", legGrade: "Data quality grade",
    gA: "A · ≥ 1 year, ≥ 95% skill", gB: "B · good, shorter or 90–95%", gC: "C · use with care",
    T_Semidiurnal: "Semidiurnal", "T_Mixed, mainly semidiurnal": "Mixed, mainly semidiurnal", "T_Mixed, mainly diurnal": "Mixed, mainly diurnal", T_Diurnal: "Diurnal",
    aboveLAT: "m above LAT", relMSL: "m rel. MSL", rising: "rising", falling: "falling", grade: "Grade", skill: "skill", range: "Range",
    atTime: "At the selected time", waterLevel: "Water level", nextHW: "Next high water", nextLW: "Next low water",
    prediction: "Tide prediction", start: "Start", length: "Length", u_h: "hours", u_d: "days", u_m: "months", u_y: "years",
    interval: "Interval", min1: "1 minute", minN: "{n} minutes", hour1: "1 hour", timeZone: "Time zone", heights: "Heights",
    hLAT: "metres above LAT (chart datum)", hMSL: "metres relative to mean sea level", hHAT: "metres relative to HAT (0 = highest tide, below is negative)", relHAT: "m rel. HAT", predict: "Predict tides",
    chartHint: "Drag to pan, scroll or pinch to zoom, double-click to reset.", tabExt: "High & low waters", tabSer: "Time series",
    dlExt: "Download high/low CSV", dlSer: "Download series CSV", cpExt: "Copy high/low",
    station: "Station", levels: "Tidal levels", constants: "Harmonic constants", showAll: "Show all {n} constituents", show10: "Show the 10 largest",
    foot: "© 2026 Aldwin Syahperdana · Tidara. Astronomical tide only: weather can raise or lower the sea by tens of centimetres.",
    location: "Location", position: "Position", localTime: "Local time", record: "Record", accuracy: "Accuracy", tideType: "Tide type",

  const zoom = (f, x) => { const r = result; if (!r) return; const pw = box.clientWidth - 48, [v0, v1] = r.view, tt = v0 + (x - 40) / pw * (v1 - v0); r.view = [tt - (tt - v0) * f, tt + (v1 - tt) * f]; clamp(); drawChart(); };
  box.addEventListener("wheel", (e) => { if (!result) return; e.preventDefault(); zoom(Math.exp(e.deltaY * 0.0018), rel(e)); }, { passive: false });
  box.addEventListener("pointerdown", (e) => { box.setPointerCapture(e.pointerId); P.set(e.pointerId, e.clientX); if (P.size === 2) { const [a, b] = [...P.values()]; p0 = { d: Math.abs(a - b), v: result.view.slice() }; } });
  box.addEventListener("pointermove", (e) => {
    if (!result) return;
    if (!P.has(e.pointerId)) { drawChart(rel(e)); return; }
    const prev = P.get(e.pointerId); P.set(e.pointerId, e.clientX);
    if (P.size === 2 && p0) { const [a, b] = [...P.values()], d = Math.abs(a - b) || 1; const c = (p0.v[0] + p0.v[1]) / 2, half = (p0.v[1] - p0.v[0]) / 2 * p0.d / d; result.view = [c - half, c + half]; clamp(); drawChart(); return; }
    const dt = (e.clientX - prev) / (box.clientWidth - 48) * (result.view[1] - result.view[0]);
    result.view = [result.view[0] - dt, result.view[1] - dt]; clamp(); drawChart(rel(e));
  });
  const end = (e) => { P.delete(e.pointerId); if (P.size < 2) p0 = null; };
  box.addEventListener("pointerup", end); box.addEventListener("pointercancel", end);

  box.addEventListener("dblclick", () => { if (result) { result.view = [result.start, result.start + (result.n - 1) * result.step]; drawChart(); } });
})();

document.querySelectorAll(".tabs button").forEach((b) => b.onclick = () => { tab = b.dataset.tab; page = 0; document.querySelectorAll(".tabs button").forEach((x) => x.classList.toggle("on", x === b)); table(); });
const PER = 50;
function table() {
  const r = result; if (!r) return;
  const unit = unitOf(r), zl = zoneAbbr(r.start, r.tz);
  const total = tab === "ext" ? r.ex.t.length : r.n, pages = Math.max(1, Math.ceil(total / PER));
  page = Math.max(0, Math.min(pages - 1, page)); const a = page * PER, b = Math.min(total, a + PER);
  let html;
  if (tab === "ext") {
    html = `<tr><th>${t("date")}</th><th>${t("time")} (${zl})</th><th></th><th class="r">${unit}</th></tr>`;
    for (let i = a; i < b; i++) { const v = r.ex.t[i], hw = r.ex.hw[i]; html += `<tr><td>${fDate(v, r.tz)}</td><td>${fTime(v, r.tz)}</td><td class="${hw ? "hw" : "lw"}">${hw ? t("high") : t("low")}</td><td class="r">${nf(r.ex.h[i] + r.off)}</td></tr>`; }
  } else {
    html = `<tr><th>${t("dateTime")} (${zl})</th><th class="r">${unit}</th></tr>`;
    for (let i = a; i < b; i++) html += `<tr><td>${fISO(r.start + i * r.step, r.tz)}</td><td class="r">${nf(r.series[i] + r.off, 3)}</td></tr>`;
  }
  $("tbl").innerHTML = `<table>${html}</table>`;
  $("pager").innerHTML = `<button id="pg0" ${page ? "" : "disabled"}>${t("first")}</button><button id="pgp" ${page ? "" : "disabled"}>${t("prev")}</button><span class="num">${t("pageOf", { a: nint(page + 1), b: nint(pages) })}</span><button id="pgn" ${page < pages - 1 ? "" : "disabled"}>${t("next")}</button><button id="pgl" ${page < pages - 1 ? "" : "disabled"}>${t("last")}</button>`;
  $("pg0").onclick = () => { page = 0; table(); }; $("pgp").onclick = () => { page--; table(); };
  $("pgn").onclick = () => { page++; table(); }; $("pgl").onclick = () => { page = pages - 1; table(); };
}

/* CSV export. English: comma-separated, decimal point. Indonesian: semicolon-separated, decimal comma
   (opens directly in Excel set to Indonesian regional settings). */
function csvParts(kind) {
  const r = result, id = ID(), sep = id ? ";" : ",", num = (v, d) => id ? v.toFixed(d).replace(".", ",") : v.toFixed(d);
  const hcol = { LAT: t("csvHLAT"), MSL: t("csvHMSL"), HAT: t("csvHHAT") }[r.datum], za = zoneAbbr(r.start, r.tz), zo = offStr(offH(r.start, r.tz)), zl = za === zo ? za : `${za} (${zo})`;
  const head = `﻿# ${t("csvTitle")} - ${r.s.name} (${r.s.code}); ${t("csvAstro")}; ${t("csvTimes")} ${zl}; (c) 2026 Aldwin Syahperdana\n`;
  const out = [];
  if (kind === "ext") {
    let buf = head + [t("csvDate"), t("csvType"), hcol].join(sep) + "\n";
    for (let i = 0; i < r.ex.t.length; i++) { buf += `${fISO(r.ex.t[i], r.tz)}${sep}${r.ex.hw[i] ? t("csvHW") : t("csvLW")}${sep}${num(r.ex.h[i] + r.off, 3)}\n`; if (buf.length > 1e6) { out.push(buf); buf = ""; } }
    out.push(buf);
  } else {
    let buf = head + [t("csvDate"), hcol].join(sep) + "\n";
    for (let i = 0; i < r.n; i++) { buf += `${fISO(r.start + i * r.step, r.tz)}${sep}${num(r.series[i] + r.off, 3)}\n`; if (buf.length > 4e6) { out.push(buf); buf = ""; } }
    out.push(buf);
  }
  return out;
}
let saver = null;
try { if (window.claude && typeof window.claude.use === "function") window.claude.use("downloads").then((d) => { saver = d; }).catch(() => {}); } catch (e) {}
async function download(kind) {
  if (!result) return;
  const r = result, name = `tidara_${r.s.code}_${fISO(r.start, r.tz).slice(0, 10)}_${kind === "ext" ? t("fileHL") : t("fileSer")}.csv`;
  const blob = new Blob(csvParts(kind), { type: "text/csv" });
  if (saver) {
    try { await saver.save({ filename: name, data: blob }); toast(t("saved", { f: name })); }
    catch (e) { if (e && e.code !== "declined") toast(e.code === "too_large" ? t("tooLarge") : t("dlUnavail")); }
    return;
  }
  try {
    const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000); toast(t("downloading", { f: name, s: nf(blob.size / 1e6, 1) }));
  } catch (e) { toast(t("dlFail", { e: e.message })); }
}
$("dlExt").onclick = () => download("ext"); $("dlSer").onclick = () => download("ser");
$("cpExt").onclick = async () => {
  if (!result) return; const txt = csvParts("ext").join("").replace(/^﻿/, "");
  if (txt.length > 8e6) { toast(t("tooBigCopy")); return; }
  try { await navigator.clipboard.writeText(txt); toast(t("copied", { n: nint(result.ex.t.length) })); } catch (e) { toast(t("copyBlocked")); }
};

/* ---------- language / theme refresh ---------- */
function applyLang() {
  document.querySelectorAll("[data-i18n]").forEach((el) => el.textContent = t(el.dataset.i18n));
  $("q").placeholder = t("search"); $("q").setAttribute("aria-label", t("search"));
  $("map").setAttribute("aria-label", t("mapLbl")); panel.setAttribute("aria-label", t("panelLbl")); $("pClose").setAttribute("aria-label", t("close"));
  $("zin").setAttribute("aria-label", t("zin")); $("zout").setAttribute("aria-label", t("zout"));
  $("play").setAttribute("aria-label", state.playing ? t("pause") : t("play")); $("tz").setAttribute("aria-label", t("mapTz"));
  const u = $("fUnit").options; ["h", "d", "m", "y"].forEach((k, i) => u[i].textContent = t("u_" + k));
  const st = $("fStep").options; [1, 5, 10, 15, 30, 60].forEach((n, i) => st[i].textContent = n === 1 ? t("min1") : n === 60 ? t("hour1") : t("minN", { n }));
  const dm = $("fDatum").options; dm[0].textContent = t("hLAT"); dm[1].textContent = t("hMSL"); dm[2].textContent = t("hHAT");
  const keepTz = $("tz").value || "local"; $("tz").innerHTML = tzOptions(-1); $("tz").value = keepTz;
